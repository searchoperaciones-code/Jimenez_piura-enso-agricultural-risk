name: Repository Offline CI

on:
  push:
    branches:
      - main
      - repo-hardening-v0.2
  pull_request:

jobs:
  repository-offline:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install pinned verification dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pandas==3.0.2 numpy==2.3.5 pyarrow==25.0.1 openpyxl==3.1.5

      - name: Compile Python sources
        run: |
          python -m compileall build_dataset_master.py audit_dataset_master.py audit_climate_master.py scripts tests

      - name: Run repository/offline tests
        run: |
          python -m unittest tests/test_repository_offline.py -v

      - name: Run climate certification artifact verifier
        run: |
          python audit_climate_master.py
